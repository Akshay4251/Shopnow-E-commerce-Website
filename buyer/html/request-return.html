<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Request Return - ShopNow</title>
  <meta name="description" content="Initiate an easy 30-day return for eligible products with flexible refunds on ShopNow." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />

  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />

  <!-- Common & Buyer CSS -->
  <link rel="stylesheet" href="../../common/css/global.css" />
  <link rel="stylesheet" href="../../common/css/header-footer.css" />
  <link rel="stylesheet" href="../css/buyer.css" />
</head>
<body>

  <!-- Reusable Common Header -->
  <div id="siteHeader" data-active="trending"></div>

  <!-- Main Request Return View -->
  <main class="buyer-page-wrapper">
    <div class="container">

      <!-- Breadcrumbs -->
      <span class="d-block text-coral fw-bold extra-small letter-spacing-1 mb-2">ACCOUNT / YOUR ORDERS</span>
      <h1 class="buyer-page-title mb-1">Request a return</h1>
      <p class="buyer-page-subtitle mb-4">Select an item and tell us the reason for returning.</p>

      <form id="requestReturnForm">
        <div class="row g-4 align-items-start">
          
          <!-- Left Column: Product Overview -->
          <div class="col-12 col-lg-5">
            <div class="card border-1 rounded-4 shadow-sm p-4 sticky-top" style="top: 24px;">
              <h5 class="fw-bold text-dark fs-6 mb-3">Item to return</h5>
              
              <div class="cart-item-thumb-box w-100 mb-3" style="height: 220px;">
                <img src="https://res.cloudinary.com/dpva4smxo/image/upload/v1791382197/Product_image_5_mqgoba.png" alt="Product" id="returnProductImage" />
              </div>

              <span class="badge bg-secondary-subtle text-secondary mb-1" id="returnOrderNum">Order #SN-97880</span>
              <h5 class="fw-bold text-dark fs-6 mb-1" id="returnProductTitle">Hydration Serum &amp; Body Oil</h5>
              <div class="small text-muted mb-2">Delivered on: <strong class="text-dark" id="returnDeliveredDate">Oct 08, 2026</strong></div>
              <div class="fs-5 fw-bold text-dark" id="returnProductPrice">₹ 1,499.00</div>

              <div class="alert alert-warning-subtle small border-0 mt-3 mb-0">
                <i class="bi bi-shield-check text-warning-emphasis me-1"></i>
                Eligible for free return pickup until Nov 07, 2026.
              </div>
            </div>
          </div>

          <!-- Right Column: Return Details Form -->
          <div class="col-12 col-lg-7">
            <div class="card border-1 rounded-4 shadow-sm p-4">
              <h5 class="fw-bold text-dark fs-6 mb-3">Tell us more about your return</h5>

              <!-- Reason -->
              <div class="mb-3">
                <label for="returnReasonSelect" class="form-label fw-bold small text-dark">Reason for return *</label>
                <select class="form-select" id="returnReasonSelect" required>
                  <option value="" disabled selected>Select a reason</option>
                  <option value="wrong_item">Wrong size or incorrect item delivered</option>
                  <option value="defective">Defective or damaged in transit</option>
                  <option value="not_as_described">Item didn't match photos or description</option>
                  <option value="changed_mind">No longer needed / Changed mind</option>
                  <option value="quality">Quality not as expected</option>
                </select>
              </div>

              <!-- Item Condition -->
              <div class="mb-3">
                <label for="returnConditionSelect" class="form-label fw-bold small text-dark">Item condition *</label>
                <select class="form-select" id="returnConditionSelect" required>
                  <option value="" disabled selected>Select condition</option>
                  <option value="unopened">Unopened in original manufacturer packaging</option>
                  <option value="opened_unused">Opened packaging but completely unused</option>
                  <option value="lightly_used">Lightly used with accessories included</option>
                </select>
              </div>

              <!-- Comments -->
              <div class="mb-3">
                <label for="returnCommentsText" class="form-label fw-bold small text-dark">Comments or details</label>
                <textarea class="form-control" id="returnCommentsText" rows="3" placeholder="Explain what happened..."></textarea>
              </div>

              <!-- Refund Preference -->
              <div class="mb-4">
                <label class="form-label fw-bold small text-dark">Refund preference *</label>
                <div class="payment-methods-list">
                  <div class="payment-method-item selected">
                    <input class="form-check-input mt-0" type="radio" name="refundMethodRadio" id="refundMethodOriginal" checked />
                    <label for="refundMethodOriginal" class="mb-0 fw-bold text-dark cursor-pointer flex-grow-1">
                      Refund to original payment card
                      <span class="d-block extra-small text-muted fw-normal">Estimated 3–5 business days after pickup</span>
                    </label>
                  </div>
                  <div class="payment-method-item">
                    <input class="form-check-input mt-0" type="radio" name="refundMethodRadio" id="refundMethodCredit" />
                    <label for="refundMethodCredit" class="mb-0 fw-bold text-dark cursor-pointer flex-grow-1">
                      ShopNow Store Credit
                      <span class="d-block extra-small text-muted fw-normal">Instant credit credited immediately upon pickup</span>
                    </label>
                  </div>
                </div>
              </div>

              <button type="submit" class="btn-coral-checkout" id="btnSubmitReturn">
                Submit return request
              </button>
            </div>
          </div>

        </div>
      </form>

    </div>
  </main>

  <!-- Reusable Common Footer -->
  <div id="siteFooter"></div>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../common/js/global.js"></script>
  <script src="../../common/js/header-footer.js"></script>
  <script src="../js/buyer.js"></script>
</body>
</html>
