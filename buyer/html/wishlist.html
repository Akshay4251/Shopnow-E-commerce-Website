<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Wishlist - ShopNow</title>
  <meta name="description" content="View your saved wishlist items, move them to cart, or browse new arrivals on ShopNow." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />

  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />

  <!-- Common & Buyer CSS System -->
  <link rel="stylesheet" href="../../common/css/global.css" />
  <link rel="stylesheet" href="../../common/css/header-footer.css" />
  <link rel="stylesheet" href="../css/buyer.css" />
</head>
<body>

  <!-- Reusable Common Header -->
  <div id="siteHeader" data-active="trending"></div>

  <!-- Main Wishlist View -->
  <main class="buyer-page-wrapper">
    <div class="container">
      
      <!-- Breadcrumb Tag -->
      <span class="d-block text-coral fw-bold extra-small letter-spacing-1 mb-2">SHOPNOW / YOUR SPACE</span>
      <h1 class="buyer-page-title">Your Wishlist</h1>
      <p class="buyer-page-subtitle mb-4" id="wishlistSubtitle">Keep your favourites close. Add them to your cart whenever you're ready.</p>

      <!-- Wishlist Empty State Card (matching Figma Screen 4) -->
      <div class="wishlist-empty-card d-none" id="wishlistEmptyState">
        <div class="wishlist-heart-circle">
          <i class="bi bi-heart"></i>
        </div>
        <h2 class="wishlist-empty-title">Your wishlist is empty</h2>
        <p class="wishlist-empty-desc">
          Found something you love? Save it to your wishlist and come back to it anytime.
        </p>
        <a href="catalog.html" class="btn-navy-browse">
          Browse products
        </a>
      </div>

      <!-- Wishlist Populated State (matching Figma Screen 5) -->
      <div id="wishlistActiveState">
        <!-- Sub-header Row -->
        <div class="d-flex justify-content-between align-items-center mb-4">
          <span class="fw-bold text-dark fs-6" id="wishlistItemsCountHeader">4 saved items</span>
          <a href="catalog.html" class="text-coral fw-bold text-decoration-none small">Continue shopping &rarr;</a>
        </div>

        <!-- 4-Card Responsive Grid -->
        <div class="row g-4" id="wishlistItemsContainer">
          <!-- Dynamically populated via buyer.js -->
        </div>
      </div>

    </div>
  </main>

  <!-- Reusable Common Footer -->
  <div id="siteFooter"></div>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../common/js/global.js"></script>
  <script src="../../common/js/header-footer.js"></script>
  <script src="../js/buyer.js"></script>
</body>
</html>
