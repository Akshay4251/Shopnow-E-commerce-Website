<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure Payment - ShopNow</title>
  <meta name="description" content="Enter card details to securely complete your ShopNow order payment." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />

  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />

  <!-- Common & Buyer CSS -->
  <link rel="stylesheet" href="../../common/css/global.css" />
  <link rel="stylesheet" href="../../common/css/header-footer.css" />
  <link rel="stylesheet" href="../css/buyer.css" />
</head>
<body class="bg-light">

  <!-- Minimal Header (Matching Figma) -->
  <header class="checkout-header">
    <div class="container">
      <div class="d-flex align-items-center justify-content-between">
        <a href="../../common/html/home.html" class="brand-title">
          <div class="brand-logo-icon">
            <i class="bi bi-bag-fill"></i>
          </div>
          <span>ShopNow</span>
        </a>
        <div class="d-flex align-items-center gap-2 text-muted small fw-bold">
          <i class="bi bi-shield-check text-success"></i>
          <span>256-Bit SSL Encrypted</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Payment Form Wrapper -->
  <main class="buyer-page-wrapper">
    <div class="container">
      
      <div class="payment-flow-wrapper">
        <div class="payment-form-card">
          
          <div class="payment-security-header">
            <i class="bi bi-lock-fill me-1"></i> SHOPNOW / SECURE PAYMENT
          </div>

          <h1 class="payment-main-title" id="paymentHeadingTitle">Pay for order #SN-98241</h1>

          <!-- Order Summary Box -->
          <div class="payment-order-box">
            <div class="payment-order-meta">
              <strong id="paymentOrderNumLabel">Order #SN-98241</strong>
              <span>Total amount</span>
            </div>
            <div class="payment-order-amount" id="paymentOrderAmount">₹ 5,040.00</div>
          </div>

          <!-- Payment Method Selector Tabs (Matching Screenshot 2) -->
          <div class="d-flex gap-2 mb-4 payment-tabs-group" id="paymentMethodTabs">
            <button type="button" class="btn btn-sm rounded-pill px-3 py-2 fw-semibold btn-outline-coral payment-tab-btn active" data-tab="card">Card</button>
            <button type="button" class="btn btn-sm rounded-pill px-3 py-2 fw-semibold btn-outline-secondary payment-tab-btn" data-tab="upi">UPI</button>
            <button type="button" class="btn btn-sm rounded-pill px-3 py-2 fw-semibold btn-outline-secondary payment-tab-btn" data-tab="netbanking">Net banking</button>
          </div>

          <!-- Payment Form -->
          <form id="paymentGatewayForm">
            <!-- 1. Card Tab Panel -->
            <div class="payment-tab-panel" id="panelCard">
              <h6 class="fw-bold text-dark mb-3">Card details</h6>

              <!-- Card Number -->
              <div class="payment-input-group">
                <label for="cardNumberInput">Card number</label>
                <div class="position-relative">
                  <input type="text" class="payment-input pe-5" id="cardNumberInput" placeholder="0000 0000 0000 0000" maxlength="19" value="4532 8920 1204 4242" />
                  <span class="position-absolute end-0 top-50 translate-middle-y me-3 text-muted" id="cardBrandIcon">
                    <i class="bi bi-credit-card-2-front fs-5"></i>
                  </span>
                </div>
              </div>

              <!-- Name on Card -->
              <div class="payment-input-group">
                <label for="cardNameInput">Name on card</label>
                <input type="text" class="payment-input" id="cardNameInput" placeholder="Alex Johnson" value="Shreyas Patil" />
              </div>

              <!-- Expiry & CVV -->
              <div class="row g-3">
                <div class="col-6">
                  <div class="payment-input-group">
                    <label for="cardExpiryInput">Expiry</label>
                    <input type="text" class="payment-input" id="cardExpiryInput" placeholder="MM / YY" maxlength="7" value="12 / 28" />
                  </div>
                </div>
                <div class="col-6">
                  <div class="payment-input-group">
                    <label for="cardCvvInput">CVV</label>
                    <input type="password" class="payment-input" id="cardCvvInput" placeholder="123" maxlength="4" value="894" />
                  </div>
                </div>
              </div>
            </div>

            <!-- 2. UPI Tab Panel -->
            <div class="payment-tab-panel d-none" id="panelUpi">
              <h6 class="fw-bold text-dark mb-3">UPI Payment</h6>

              <div class="payment-input-group">
                <label for="upiIdInput">Enter your UPI ID / VPA</label>
                <div class="position-relative">
                  <input type="text" class="payment-input" id="upiIdInput" placeholder="username@okhdfcbank" value="shreyas@okhdfcbank" />
                </div>
              </div>

              <div class="mb-4">
                <span class="extra-small text-muted d-block mb-2 fw-bold">OR PAY WITH UPI APP:</span>
                <div class="d-flex flex-wrap gap-2">
                  <button type="button" class="btn btn-sm btn-outline-dark rounded-pill py-1 px-3 btn-upi-app" data-app="Google Pay">
                    <i class="bi bi-google me-1"></i> Google Pay
                  </button>
                  <button type="button" class="btn btn-sm btn-outline-dark rounded-pill py-1 px-3 btn-upi-app" data-app="PhonePe">
                    <i class="bi bi-phone me-1"></i> PhonePe
                  </button>
                  <button type="button" class="btn btn-sm btn-outline-dark rounded-pill py-1 px-3 btn-upi-app" data-app="Paytm">
                    <i class="bi bi-wallet2 me-1"></i> Paytm
                  </button>
                </div>
              </div>
            </div>

            <!-- 3. Net Banking Tab Panel (Matching Screenshot 2) -->
            <div class="payment-tab-panel d-none" id="panelNetBanking">
              <h6 class="fw-bold text-dark mb-3">Net banking</h6>

              <div class="payment-input-group mb-4">
                <label for="bankSelectDropdown" class="text-muted small mb-2 d-block">Choose your bank</label>
                <select class="form-select payment-input py-2" id="bankSelectDropdown">
                  <option value="ICICI Bank" selected>ICICI Bank</option>
                  <option value="HDFC Bank">HDFC Bank</option>
                  <option value="State Bank of India">State Bank of India (SBI)</option>
                  <option value="Axis Bank">Axis Bank</option>
                  <option value="Kotak Mahindra Bank">Kotak Mahindra Bank</option>
                  <option value="Punjab National Bank">Punjab National Bank</option>
                </select>
              </div>
            </div>

            <!-- Demo Simulation Controls -->
            <div class="bg-light p-2 rounded-3 border mb-3 text-center">
              <span class="extra-small text-muted d-block mb-1 fw-bold">DEMO SIMULATOR OUTCOME:</span>
              <div class="btn-group btn-group-sm w-100" role="group">
                <input type="radio" class="btn-check" name="demoOutcomeRadio" id="outcomeSuccess" value="success" checked />
                <label class="btn btn-outline-success" for="outcomeSuccess"><i class="bi bi-check-circle"></i> Success Flow</label>

                <input type="radio" class="btn-check" name="demoOutcomeRadio" id="outcomeFail" value="failed" />
                <label class="btn btn-outline-danger" for="outcomeFail"><i class="bi bi-x-circle"></i> Failed Flow</label>
              </div>
            </div>

            <!-- Pay Now Button -->
            <button type="submit" class="btn-coral-pay" id="btnPayNowSubmit">
              Pay now
            </button>

            <!-- Encrypted Note -->
            <div class="payment-encrypted-badge">
              <i class="bi bi-lock-fill"></i>
              <span>Your payment is encrypted and securely processed.</span>
            </div>
          </form>

        </div>
      </div>

    </div>
  </main>

  <!-- Reusable Common Footer -->
  <div id="siteFooter"></div>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../common/js/global.js"></script>
  <script src="../../common/js/header-footer.js"></script>
  <script src="../js/buyer.js"></script>
</body>
</html>
