<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Cancelled - ShopNow</title>
  <meta name="description" content="Your order cancellation has been processed and refund has been initiated." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />

  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />

  <!-- Common & Buyer CSS -->
  <link rel="stylesheet" href="../../common/css/global.css" />
  <link rel="stylesheet" href="../../common/css/header-footer.css" />
  <link rel="stylesheet" href="../css/buyer.css" />
</head>
<body class="bg-light">

  <!-- Reusable Common Header -->
  <div id="siteHeader" data-active="trending"></div>

  <!-- Main View -->
  <main class="buyer-page-wrapper">
    <div class="container">
      
      <div class="d-flex justify-content-center py-4">
        <div class="status-card-center">
          
          <div class="status-circle-icon success">
            <i class="bi bi-check-circle"></i>
          </div>

          <h1 class="status-card-title">Your order has been cancelled</h1>
          <p class="status-card-subtitle">
            Order <strong id="cancelledOrderNumLabel">#SN-98104</strong> has been cancelled. A refund of <strong id="cancelledRefundAmountLabel">₹ 1,899.00</strong> has been initiated to your original payment method.
          </p>

          <div class="d-flex flex-wrap gap-3 justify-content-center mt-4">
            <a href="orders.html" class="btn-coral-checkout flex-grow-1" id="btnCancelledViewOrders">
              View all orders
            </a>
            <a href="../../common/html/home.html" class="btn-outline-continue flex-grow-1 text-center" id="btnCancelledHome">
              Back to home
            </a>
          </div>

        </div>
      </div>

    </div>
  </main>

  <!-- Reusable Common Footer -->
  <div id="siteFooter"></div>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../common/js/global.js"></script>
  <script src="../../common/js/header-footer.js"></script>
  <script src="../js/buyer.js"></script>
</body>
</html>
