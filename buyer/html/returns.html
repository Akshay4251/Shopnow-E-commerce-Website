<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Returns &amp; Refunds - ShopNow</title>
  <meta name="description" content="Track pickup and inspection status for items you returned, plus refund progress on ShopNow." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />

  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />

  <!-- Common & Buyer CSS -->
  <link rel="stylesheet" href="../../common/css/global.css" />
  <link rel="stylesheet" href="../../common/css/header-footer.css" />
  <link rel="stylesheet" href="../css/buyer.css" />
</head>
<body>

  <!-- Reusable Common Header -->
  <div id="siteHeader" data-active="trending"></div>

  <!-- Main Return Status View -->
  <main class="buyer-page-wrapper">
    <div class="container">

      <!-- Breadcrumbs -->
      <span class="d-block text-coral fw-bold extra-small letter-spacing-1 mb-2">ACCOUNT / RETURNS &amp; REFUNDS</span>
      
      <div class="d-flex flex-wrap justify-content-between align-items-end mb-4 gap-3">
        <div>
          <h1 class="buyer-page-title mb-1">Returns &amp; Refunds</h1>
          <p class="buyer-page-subtitle mb-0">Track the status of your returned items, doorstep pickups and refunds in real time.</p>
        </div>

        <div class="d-flex flex-wrap align-items-center gap-3">
          <div class="d-flex align-items-center gap-2">
            <label for="returnStatusFilter" class="small text-muted fw-bold mb-0">Filter by status:</label>
            <select class="form-select form-select-sm fw-semibold w-auto" id="returnStatusFilter">
              <option value="all" selected>All returns</option>
              <option value="in_progress">In progress</option>
              <option value="completed">Completed</option>
            </select>
          </div>
          <a href="orders.html" class="btn btn-sm btn-coral px-3 rounded-pill">
            <i class="bi bi-arrow-return-left me-1"></i> Return another item
          </a>
        </div>
      </div>

      <!-- Returns List Container -->
      <div id="returnsListContainer">
        <!-- Dynamic Return Cards -->
      </div>

    </div>
  </main>

  <!-- Reusable Common Footer -->
  <div id="siteFooter"></div>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../common/js/global.js"></script>
  <script src="../../common/js/header-footer.js"></script>
  <script src="../js/buyer.js"></script>
</body>
</html>
