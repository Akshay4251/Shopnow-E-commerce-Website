<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Orders - ShopNow</title>
  <meta name="description" content="View past and upcoming ShopNow orders, download invoices, track packages, and initiate returns." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />

  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />

  <!-- Common & Buyer CSS -->
  <link rel="stylesheet" href="../../common/css/global.css" />
  <link rel="stylesheet" href="../../common/css/header-footer.css" />
  <link rel="stylesheet" href="../css/buyer.css" />
</head>
<body>

  <!-- Reusable Common Header -->
  <div id="siteHeader" data-active="trending"></div>

  <!-- Main Orders View -->
  <main class="buyer-page-wrapper">
    <div class="container">

      <!-- Breadcrumbs -->
      <span class="d-block text-coral fw-bold extra-small letter-spacing-1 mb-2">ACCOUNT / YOUR ORDERS</span>
      
      <div class="d-flex flex-wrap justify-content-between align-items-end mb-4 gap-3">
        <div>
          <h1 class="buyer-page-title mb-1">Your Orders</h1>
          <p class="buyer-page-subtitle mb-0">Track upcoming orders, follow returns and manage recent items.</p>
        </div>

        <!-- Search & Date Filter Bar -->
        <div class="d-flex flex-wrap align-items-center gap-3">
          <div class="position-relative" style="min-width: 250px;">
            <i class="bi bi-search position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"></i>
            <input type="text" id="buyerOrderSearchInput" class="form-control form-control-sm ps-5 rounded-pill" placeholder="Search orders by item or ID..." />
          </div>
          <div class="d-flex align-items-center gap-2">
            <label for="orderDateFilter" class="small text-muted fw-bold mb-0">Date filter:</label>
            <select class="form-select form-select-sm fw-semibold w-auto" id="orderDateFilter">
              <option value="last3months" selected>Last 3 months</option>
              <option value="last30days">Last 30 days</option>
              <option value="2026">2026</option>
              <option value="2025">2025</option>
              <option value="all">All orders</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Orders List Container -->
      <div id="ordersListContainer">
        <!-- Dynamic Order Cards matching Figma Screen 2 center -->
      </div>

    </div>
  </main>

  <!-- Review Modal -->
  <div class="modal fade" id="orderReviewModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content rounded-4 border-0 shadow">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title fw-bold" id="orderReviewModalTitle">Write a Product Review</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="orderReviewSubmitForm">
            <input type="hidden" id="reviewModalProductId" />
            <div class="mb-3">
              <label class="form-label small fw-bold">Overall Rating</label>
              <select class="form-select" id="reviewModalRating">
                <option value="5">★★★★★ (5/5) - Excellent</option>
                <option value="4">★★★★☆ (4/5) - Good</option>
                <option value="3">★★★☆☆ (3/5) - Average</option>
                <option value="2">★★☆☆☆ (2/5) - Not satisfied</option>
                <option value="1">★☆☆☆☆ (1/5) - Poor</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-bold">Headline</label>
              <input type="text" class="form-control" id="reviewModalHeadline" placeholder="What's the most important thing to know?" required />
            </div>
            <div class="mb-3">
              <label class="form-label small fw-bold">Your Review</label>
              <textarea class="form-control" id="reviewModalBody" rows="4" placeholder="How did this product perform? What did you like or dislike?" required></textarea>
            </div>
            <button type="submit" class="btn-coral-block">Submit Review</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Invoice Modal -->
  <div class="modal fade" id="invoiceModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content rounded-4 border-0 shadow">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title fw-bold">Official Invoice</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4" id="invoiceModalContent">
          <!-- Rendered Invoice Content -->
        </div>
        <div class="modal-footer border-0">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
          <button type="button" class="btn btn-dark" onclick="window.print()"><i class="bi bi-printer me-1"></i> Print Invoice</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Reusable Common Footer -->
  <div id="siteFooter"></div>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../common/js/global.js"></script>
  <script src="../../common/js/header-footer.js"></script>
  <script src="../js/buyer.js"></script>
</body>
</html>
