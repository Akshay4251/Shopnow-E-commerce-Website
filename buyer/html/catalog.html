<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products Catalog - ShopNow Marketplace</title>
  <meta name="description" content="Browse products, filter by category, price, and customer rating on ShopNow." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />

  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />

  <!-- Common & Buyer CSS System -->
  <link rel="stylesheet" href="../../common/css/global.css" />
  <link rel="stylesheet" href="../../common/css/header-footer.css" />
  <link rel="stylesheet" href="../css/buyer.css" />
</head>
<body>

  <!-- Reusable Common Header -->
  <div id="siteHeader" data-active="trending"></div>

  <!-- Main Catalog Content -->
  <main class="buyer-page-wrapper">
    <div class="container">
      
      <!-- Breadcrumb -->
      <nav class="buyer-breadcrumb">
        <a href="../../common/html/home.html">Home</a>
        <span>&gt;</span>
        <span class="active">Catalog</span>
      </nav>

      <div class="row g-4">
        <!-- Left Column: Filters Sidebar -->
        <aside class="col-lg-3">
          <div class="filters-sidebar-card">
            <span class="filters-header-tag">REFINE RESULTS</span>
            <h3 class="filters-card-title">Filters</h3>

            <!-- Category Filter Block -->
            <div class="filter-block">
              <h5 class="filter-block-title">Category</h5>
              <div id="categoryFiltersList">
                <label class="filter-checkbox-item">
                  <input type="checkbox" value="all" checked /> All Categories
                </label>
                <label class="filter-checkbox-item">
                  <input type="checkbox" value="Sweaters" /> Sweaters &amp; Apparel
                </label>
                <label class="filter-checkbox-item">
                  <input type="checkbox" value="Audio" /> Audio &amp; Sound
                </label>
                <label class="filter-checkbox-item">
                  <input type="checkbox" value="Decor" /> Home &amp; Decor
                </label>
                <label class="filter-checkbox-item">
                  <input type="checkbox" value="Accessories" /> Bags &amp; Accessories
                </label>
                <label class="filter-checkbox-item">
                  <input type="checkbox" value="Footwear" /> Footwear
                </label>
                <label class="filter-checkbox-item">
                  <input type="checkbox" value="Skincare" /> Beauty &amp; Skincare
                </label>
                <label class="filter-checkbox-item">
                  <input type="checkbox" value="Luggage" /> Travel &amp; Luggage
                </label>
                <label class="filter-checkbox-item">
                  <input type="checkbox" value="Portable Tech" /> Portable Tech
                </label>
              </div>
            </div>

            <!-- Price Filter Block -->
            <div class="filter-block">
              <h5 class="filter-block-title">Price</h5>
              <div class="price-inputs-row">
                <div class="price-input-wrap">
                  <label>Min</label>
                  <input type="number" id="minPriceInput" placeholder="Min price (₹)" min="0" />
                </div>
                <div class="price-input-wrap">
                  <label>Max</label>
                  <input type="number" id="maxPriceInput" placeholder="Max price (₹)" min="0" />
                </div>
                <button type="button" class="btn btn-sm btn-outline-dark w-100 mt-2" id="btnApplyPriceFilter">Apply Price</button>
              </div>
            </div>

            <!-- Rating Filter Block -->
            <div class="filter-block">
              <h5 class="filter-block-title">Rating</h5>
              <label class="filter-rating-item">
                <input type="radio" name="ratingFilter" value="0" checked />
                <span>All Ratings</span>
              </label>
              <label class="filter-rating-item">
                <input type="radio" name="ratingFilter" value="4" />
                <span class="filter-stars">★★★★☆</span> 4 and up
              </label>
              <label class="filter-rating-item">
                <input type="radio" name="ratingFilter" value="3" />
                <span class="filter-stars">★★★☆☆</span> 3 and up
              </label>
            </div>

            <button type="button" class="btn btn-sm btn-link text-coral p-0 text-decoration-none fw-bold" id="btnResetFilters">Reset all filters</button>
          </div>
        </aside>

        <!-- Right Column: Results & Products Grid -->
        <section class="col-lg-9">
          <!-- Header and Sort Control -->
          <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center gap-3 catalog-results-header">
            <div>
              <h1 class="catalog-results-title" id="catalogResultsTitle">8 results for all items</h1>
              <p class="catalog-results-sub">Browse products selected from across ShopNow.</p>
            </div>
            <div class="sort-select-box">
              <label class="d-none" for="sortSelect">Sort by</label>
              <select class="form-select" id="sortSelect">
                <option value="featured">Sort by: Featured</option>
                <option value="price-low">Price: low to high</option>
                <option value="price-high">Price: high to low</option>
                <option value="rating">Top Rated</option>
              </select>
            </div>
          </div>

          <!-- Product Cards Grid (4 columns) -->
          <div class="row g-4" id="catalogProductsContainer">
            <!-- Dynamically populated via buyer.js -->
          </div>

          <!-- Pagination -->
          <div class="catalog-pagination">
            <button class="page-btn-item">&lt;</button>
            <button class="page-btn-item active">1</button>
            <button class="page-btn-item">2</button>
            <button class="page-btn-item">3</button>
            <button class="page-btn-item">4</button>
            <button class="page-btn-item">&gt;</button>
          </div>
        </section>
      </div>

    </div>
  </main>

  <!-- Reusable Common Footer -->
  <div id="siteFooter"></div>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../common/js/global.js"></script>
  <script src="../../common/js/header-footer.js"></script>
  <script src="../js/buyer.js"></script>
</body>
</html>
