<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Platform Reports &amp; Analytics - ShopNow Admin</title>
  <meta name="description" content="Detailed financial analytics, multi-vendor performance reports, gross merchandise value trends, and fiscal audits." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />

  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />

  <!-- Common & Admin CSS -->
  <link rel="stylesheet" href="../../common/css/global.css" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body class="admin-body">

  <div class="admin-layout">
    <!-- Reusable Dark Navy Sidebar (Active Tab: reports) -->
    <aside class="admin-sidebar" id="adminSidebar" data-active="reports"></aside>

    <!-- Main Content Area -->
    <div class="admin-main">
      <!-- Reusable Top Header Bar -->
      <header class="admin-topbar" id="adminTopBar"></header>

      <!-- Reports Content (Matching Figma Image 6) -->
      <main class="admin-content">
        <!-- Page Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div>
            <h1 class="admin-page-title">Executive Reports</h1>
            <p class="admin-page-subtitle">Consolidated revenue trajectories, GMV audits, and merchant sales health.</p>
          </div>
          <button type="button" class="btn btn-coral-admin btn-sm px-3" id="btnExportAdminReport">
            <i class="bi bi-file-earmark-pdf-fill"></i> Download Audit PDF
          </button>
        </div>

        <!-- 4 Stat Metric Cards -->
        <div class="row g-3 mb-4">
          <div class="col-6 col-md-3">
            <div class="admin-stat-card">
              <div>
                <span class="stat-label">Gross Platform Volume</span>
                <div class="stat-number text-coral" style="font-size: 1.5rem;">₹ 5,20,000</div>
                <span class="extra-small text-success fw-bold">+22% YoY</span>
              </div>
              <div class="stat-icon bg-coral-subtle text-coral" style="background-color: #fef2ee; color: #ff5338;"><i class="bi bi-graph-up"></i></div>
            </div>
          </div>

          <div class="col-6 col-md-3">
            <div class="admin-stat-card">
              <div>
                <span class="stat-label">Commission Take Rate</span>
                <div class="stat-number">10.0%</div>
                <span class="extra-small text-muted">Fixed tier benchmark</span>
              </div>
              <div class="stat-icon bg-info-subtle text-info"><i class="bi bi-pie-chart-fill"></i></div>
            </div>
          </div>

          <div class="col-6 col-md-3">
            <div class="admin-stat-card">
              <div>
                <span class="stat-label">Avg Order Value</span>
                <div class="stat-number" style="font-size: 1.5rem;">₹ 1,840</div>
                <span class="extra-small text-success fw-bold">+5.4%</span>
              </div>
              <div class="stat-icon bg-success-subtle text-success"><i class="bi bi-cart-check"></i></div>
            </div>
          </div>

          <div class="col-6 col-md-3">
            <div class="admin-stat-card">
              <div>
                <span class="stat-label">Fulfillment Speed</span>
                <div class="stat-number">1.2 Days</div>
                <span class="extra-small text-success fw-bold">4.9/5 satisfaction</span>
              </div>
              <div class="stat-icon bg-purple-subtle text-purple" style="background-color: #f3e8ff; color: #7e22ce;"><i class="bi bi-lightning-charge"></i></div>
            </div>
          </div>
        </div>

        <!-- Sales Analytics Chart Card -->
        <div class="admin-card mb-4">
          <h6 class="fw-bold text-dark mb-3">Gross Merchandise Value Trajectory</h6>
          <div class="p-3 bg-light rounded-3" style="height: 240px;">
            <svg viewBox="0 0 600 150" class="w-100 h-100" preserveAspectRatio="none">
              <path fill="rgba(255,83,56,0.15)" d="M 0,120 Q 100,70 200,100 T 400,40 T 600,60 L 600,150 L 0,150 Z"></path>
              <path fill="none" stroke="#ff5338" stroke-width="3" d="M 0,120 Q 100,70 200,100 T 400,40 T 600,60"></path>
            </svg>
          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../common/js/global.js"></script>
  <script src="../js/admin-nav.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
