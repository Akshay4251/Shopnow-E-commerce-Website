<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Category Management - ShopNow Admin</title>
  <meta name="description" content="Manage marketplace taxonomy, create new product categories, edit department slugs, and maintain catalog classification." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />

  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />

  <!-- Common & Admin CSS -->
  <link rel="stylesheet" href="../../common/css/global.css" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body class="admin-body">

  <div class="admin-layout">
    <!-- Reusable Dark Navy Sidebar (Active Tab: categories) -->
    <aside class="admin-sidebar" id="adminSidebar" data-active="categories"></aside>

    <!-- Main Content Area -->
    <div class="admin-main">
      <!-- Reusable Top Header Bar -->
      <header class="admin-topbar" id="adminTopBar"></header>

      <!-- Category Management Content (Matching Figma Image 4 Right Column) -->
      <main class="admin-content">
        <!-- Page Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div>
            <h1 class="admin-page-title">Categories</h1>
            <p class="admin-page-subtitle">Configure e-commerce taxonomy, department hierarchies, and catalog slugs.</p>
          </div>
          <button type="button" class="btn btn-coral-admin btn-sm px-3" data-bs-toggle="modal" data-bs-target="#addCategoryModal">
            <i class="bi bi-plus-lg"></i> Add Category
          </button>
        </div>

        <!-- Category Grid Container (Matching Figma 1.8.5) -->
        <div class="row g-3" id="adminCategoriesList">
          <!-- Populated dynamically by admin.js -->
        </div>

      </main>
    </div>
  </div>

  <!-- 1.8.1 Add Category Modal (Matching Figma) -->
  <div class="modal fade" id="addCategoryModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content rounded-4 border-0 shadow">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title fw-bold text-dark">Add New Category</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="btnAddCategoryForm">
          <div class="modal-body py-4">
            <div class="mb-3">
              <label class="form-label extra-small fw-bold text-uppercase text-muted">Category Name *</label>
              <input type="text" class="form-control extra-small py-2" id="newCategoryName" placeholder="e.g. Footwear &amp; Sneakers" required />
            </div>
            <div class="mb-3">
              <label class="form-label extra-small fw-bold text-uppercase text-muted">Display Order / Priority</label>
              <input type="number" class="form-control extra-small py-2" value="1" min="1" />
            </div>
          </div>
          <div class="modal-footer border-0 pt-0">
            <button type="button" class="btn btn-light extra-small px-3" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-coral-admin extra-small px-4">Create Category</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../common/js/global.js"></script>
  <script src="../js/admin-nav.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
