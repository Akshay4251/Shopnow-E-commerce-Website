 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search results · ShopNow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/search-common.css" rel="stylesheet">
</head>
<body class="bg-light">
  <!-- DEMO ONLY: one results page shared by seller, admin and agent, module taken from ?module=.
       Each team builds its own results page with a fixed <body data-module="..."> and calls ShopNow.search the same way. -->
  <script>document.body.setAttribute('data-module', new URLSearchParams(location.search).get('module') || 'seller');</script>

  <div class="bg-white border-bottom"><div class="container py-3" data-shopnow-search></div></div>

  <main class="container py-4" style="max-width:820px">
    <h1 class="h4 mb-1" id="heading">Results</h1>
    <p class="text-muted" id="sub"></p>
    <div class="list-group" id="list"></div>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/search-fake-api.js"></script>
  <script src="../js/search-common.js"></script>
  <script src="../js/search.js"></script>
  <script>
    $(function () {
      var p = new URLSearchParams(location.search), q = p.get('q') || '';
      ShopNow.search({ q: q, page: p.get('page') || 1 })
        .done(function (res) {
          $('#heading').text(res.total + ' result' + (res.total === 1 ? '' : 's') + ' for “' + q + '”');
          $('#sub').text(res.total ? 'Page ' + res.page + ' of ' + res.pages : 'Try a different search term.');
          $('#list').html(res.items.map(function (i) {
            return '<a class="list-group-item list-group-item-action d-flex justify-content-between align-items-center" href="' + ShopNow.esc(i.href) + '">' +
              '<span><span class="fw-semibold">' + ShopNow.esc(i.label) + '</span><br><small class="text-muted">' + ShopNow.esc(i.sub) + '</small></span>' +
              '<span class="badge text-bg-light border">' + ShopNow.esc(i.type) + '</span></a>';
          }).join(''));
        })
        .fail(function () { $('#heading').text('Could not load results.'); });
    });
  </script>
</body>
</html>
