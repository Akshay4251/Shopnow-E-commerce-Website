 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search bar demo · ShopNow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/search-common.css" rel="stylesheet">
</head>
<body class="bg-light">
  <!-- DEMO ONLY: in a real module you write  <body data-module="seller">  (or admin / agent; customer needs nothing).
       Here the module comes from ?module= so one page can show all four. -->
  <script>document.body.setAttribute('data-module', new URLSearchParams(location.search).get('module') || 'customer');</script>

  <!-- DEMO ONLY: stands in for your own header. The only hook is the placeholder below. -->
  <div class="bg-white border-bottom">
    <div class="container d-flex align-items-center gap-3 py-3">
      <strong class="fs-5">YourHeader</strong>
      <div class="flex-grow-1" data-shopnow-search></div>
    </div>
  </div>

  <main class="container py-5" style="min-height:420px">
    <label class="form-label fw-semibold" for="moduleSel">Preview as</label>
    <select id="moduleSel" class="form-select mb-4" style="max-width:260px">
      <option value="customer">Customer module</option>
      <option value="seller">Seller module</option>
      <option value="admin">Admin module</option>
      <option value="agent">Delivery agent module</option>
    </select>
    <p class="text-muted mb-1">Try typing:</p>
    <ul class="text-muted" id="hints"></ul>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/search-fake-api.js"></script>   <!-- remove when the real backend exists -->
  <script src="../js/search-common.js"></script>
  <script src="../js/search.js"></script>
  <script>
    var HINTS = {
      customer: ['face', 'hearth', 'ele'],
      seller:   ['blanket (your product)', 'SN1001 (your order)', 'jordan (customer name)'],
      admin:    ['avery (user)', 'stride (seller)', 'SN1004 (order)'],
      agent:    ['411001 (PIN code)', 'SN1002 (order number)', 'baner (area)']
    };
    var m = ShopNow.getModule();
    $('#moduleSel').val(m).on('change', function () { location.search = '?module=' + this.value; });
    $('#hints').html(HINTS[m].map(function (h) { return '<li><code>' + h.split(' ')[0] + '</code> ' + h.split(' ').slice(1).join(' ') + '</li>'; }).join(''));
  </script>
</body>
</html>
