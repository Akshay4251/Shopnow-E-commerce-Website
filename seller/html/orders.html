<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orders Management - Seller Center</title>
  <meta name="description" content="View and process incoming customer orders, manage shipments, and update fulfillment states on ShopNow." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />

  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />

  <!-- Common & Seller CSS -->
  <link rel="stylesheet" href="../../common/css/global.css" />
  <link rel="stylesheet" href="../css/seller.css" />
</head>
<body class="seller-body">

  <!-- Reusable Seller Header & Subnav -->
  <div id="sellerHeader" data-active="orders"></div>

  <!-- Orders Main Content -->
  <main class="seller-page-wrapper">
    <div class="container">

      <!-- Breadcrumbs -->
      <span class="d-block text-coral fw-bold extra-small letter-spacing-1 mb-2">SALES / ORDERS</span>
      <h1 class="seller-page-title mb-4">Orders</h1>

      <!-- 4 Top Metric Cards (Matching Figma Image 3 Screen 2) -->
      <div class="row g-3 mb-4" id="sellerOrdersFilterGroup">
        <!-- All -->
        <div class="col-6 col-md-3">
          <button type="button" class="btn btn-dark w-100 p-3 text-start rounded-4 border-0 shadow-sm" data-filter="all">
            <span class="d-block extra-small text-secondary text-uppercase fw-bold">All Orders</span>
            <span class="fs-2 fw-bold text-white" id="kpiAllOrdersCount">0</span>
          </button>
        </div>

        <!-- Processing -->
        <div class="col-6 col-md-3">
          <button type="button" class="btn btn-outline-secondary bg-white w-100 p-3 text-start rounded-4 shadow-sm" data-filter="processing">
            <span class="d-block extra-small text-warning-emphasis text-uppercase fw-bold">Processing</span>
            <span class="fs-2 fw-bold text-dark" id="kpiProcessingCount">0</span>
          </button>
        </div>

        <!-- Shipped -->
        <div class="col-6 col-md-3">
          <button type="button" class="btn btn-outline-secondary bg-white w-100 p-3 text-start rounded-4 shadow-sm" data-filter="shipped">
            <span class="d-block extra-small text-purple text-uppercase fw-bold">Shipped</span>
            <span class="fs-2 fw-bold text-dark" id="kpiShippedCount">0</span>
          </button>
        </div>

        <!-- Delivered -->
        <div class="col-6 col-md-3">
          <button type="button" class="btn btn-outline-secondary bg-white w-100 p-3 text-start rounded-4 shadow-sm" data-filter="delivered">
            <span class="d-block extra-small text-success text-uppercase fw-bold">Delivered</span>
            <span class="fs-2 fw-bold text-dark" id="kpiDeliveredCount">0</span>
          </button>
        </div>
      </div>

      <!-- Filter Bar -->
      <div class="seller-filter-toolbar">
        <div class="flex-grow-1 position-relative" style="min-width: 240px;">
          <i class="bi bi-search position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"></i>
          <input type="text" class="form-control form-control-sm ps-5 rounded-pill" id="sellerOrdersSearchInput" placeholder="Search by order ID or customer name..." />
        </div>

        <select class="form-select form-select-sm w-auto rounded-pill">
          <option>Date: Last 30 days</option>
          <option>Date: This month</option>
          <option>Date: All time</option>
        </select>

        <select class="form-select form-select-sm w-auto rounded-pill">
          <option>Payment: All</option>
          <option>Paid (UPI/Card)</option>
          <option>Cash on delivery</option>
        </select>
      </div>

      <!-- Orders Table (Matching Figma Image 3 Screen 2) -->
      <div class="seller-card-table">
        <div class="table-responsive">
          <table class="table table-seller">
            <thead>
              <tr>
                <th>Order ID</th>
                <th>Date</th>
                <th>Customer</th>
                <th>Items</th>
                <th>Total</th>
                <th>Payment</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="sellerOrdersTableBody">
              <!-- Dynamically hydrated via seller.js -->
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>

  <!-- Reusable Seller Footer -->
  <div id="sellerFooter"></div>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../common/js/global.js"></script>
  <script src="../js/seller-nav.js"></script>
  <script src="../js/seller.js"></script>
</body>
</html>
