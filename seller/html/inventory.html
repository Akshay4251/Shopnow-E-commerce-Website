<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventory Management - Seller Center</title>
  <meta name="description" content="Monitor warehouse stock levels, adjust unit quantities, and configure low-stock alerts on ShopNow." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />

  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />

  <!-- Common & Seller CSS -->
  <link rel="stylesheet" href="../../common/css/global.css" />
  <link rel="stylesheet" href="../css/seller.css" />
</head>
<body class="seller-body">

  <!-- Reusable Seller Header & Subnav -->
  <div id="sellerHeader" data-active="inventory"></div>

  <!-- Inventory Main Content -->
  <main class="seller-page-wrapper">
    <div class="container">

      <!-- Breadcrumbs -->
      <span class="d-block text-coral fw-bold extra-small letter-spacing-1 mb-2">OPERATIONS / INVENTORY</span>
      <h1 class="seller-page-title mb-4">Inventory</h1>

      <!-- 3 Summary Metric Cards (Matching Figma Image 2 Screen 4) -->
      <div class="row g-3 mb-4">
        <!-- Low stock -->
        <div class="col-12 col-md-4">
          <div class="seller-alert-card peach py-3">
            <div class="d-flex justify-content-between align-items-center">
              <div>
                <span class="seller-subcard-tag d-block text-warning-emphasis">Low stock</span>
                <span class="fs-2 fw-bold text-dark" id="kpiInventoryLowStock">0</span>
              </div>
              <i class="bi bi-exclamation-triangle-fill fs-2 text-warning"></i>
            </div>
          </div>
        </div>

        <!-- In stock -->
        <div class="col-12 col-md-4">
          <div class="seller-alert-card lavender py-3">
            <div class="d-flex justify-content-between align-items-center">
              <div>
                <span class="seller-subcard-tag d-block text-purple">In stock</span>
                <span class="fs-2 fw-bold text-dark" id="kpiInventoryInStock">0</span>
              </div>
              <i class="bi bi-check-circle-fill fs-2 text-success"></i>
            </div>
          </div>
        </div>

        <!-- Out of stock -->
        <div class="col-12 col-md-4">
          <div class="seller-alert-card bg-danger-subtle border-danger-subtle py-3">
            <div class="d-flex justify-content-between align-items-center">
              <div>
                <span class="seller-subcard-tag d-block text-danger">Out of stock</span>
                <span class="fs-2 fw-bold text-dark" id="kpiInventoryOutOfStock">0</span>
              </div>
              <i class="bi bi-x-octagon-fill fs-2 text-danger"></i>
            </div>
          </div>
        </div>
      </div>

      <!-- Filter Tabs & Search Bar (Matching Figma Image 2 Screen 4) -->
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
        <div class="btn-group btn-group-sm" role="group" id="inventoryFilterTabs">
          <button type="button" class="btn btn-outline-secondary active" data-filter="all">All stock</button>
          <button type="button" class="btn btn-outline-secondary" data-filter="in">In stock</button>
          <button type="button" class="btn btn-outline-secondary" data-filter="low">Low stock</button>
          <button type="button" class="btn btn-outline-secondary" data-filter="out">Out of stock</button>
        </div>

        <div class="d-flex align-items-center gap-2">
          <input type="text" class="form-control form-control-sm rounded-pill" placeholder="Search inventory..." style="width: 200px;" />
          <select class="form-select form-select-sm w-auto rounded-pill">
            <option>Sort by: Stock (Low to High)</option>
            <option>Sort by: Stock (High to Low)</option>
            <option>Sort by: Title (A-Z)</option>
          </select>
        </div>
      </div>

      <!-- Inventory Table -->
      <div class="seller-card-table">
        <div class="table-responsive">
          <table class="table table-seller">
            <thead>
              <tr>
                <th>Product</th>
                <th>SKU</th>
                <th>Price</th>
                <th>Stock quantity</th>
                <th>Stock status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="inventoryTableBody">
              <!-- Dynamically hydrated via seller.js -->
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>

  <!-- Update Stock Modal (Matching Figma Image 3 Screen 1) -->
  <div class="modal fade" id="updateStockModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content rounded-4 border-0 shadow">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title fw-bold">Update Stock</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body py-3">
          <div class="p-3 bg-light rounded-3 mb-3">
            <h6 class="fw-bold text-dark mb-1 fs-6" id="modalStockProdTitle">Speckled ceramic mug</h6>
            <span class="extra-small text-muted" id="modalStockProdSku">SKU: MH-CER-012</span>
          </div>

          <div class="mb-3">
            <label for="modalCurrentStockQty" class="form-label small fw-bold text-dark">Available units *</label>
            <input type="number" class="form-control" id="modalCurrentStockQty" min="0" required />
            <span class="extra-small text-muted mt-1 d-block">Adjusting this reflects live inventory across the ShopNow customer marketplace immediately.</span>
          </div>
        </div>
        <div class="modal-footer border-0 pt-0">
          <button type="button" class="btn btn-sm btn-light px-3" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-sm btn-coral-seller px-3" id="btnSaveModalStock">Save stock</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Reusable Seller Footer -->
  <div id="sellerFooter"></div>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../common/js/global.js"></script>
  <script src="../js/seller-nav.js"></script>
  <script src="../js/seller.js"></script>
</body>
</html>
