<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shipping & Logistics - Seller Center</title>
  <meta name="description" content="Manage shipments, courier dispatches, tracking numbers and print shipping labels on ShopNow Seller Center." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />

  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />

  <!-- Common & Seller CSS -->
  <link rel="stylesheet" href="../../common/css/global.css" />
  <link rel="stylesheet" href="../css/seller.css" />
</head>
<body class="seller-body">

  <!-- Reusable Seller Header & Subnav -->
  <div id="sellerHeader" data-active="shipping"></div>

  <!-- Shipping Content -->
  <main class="seller-page-wrapper">
    <div class="container">

      <!-- Breadcrumbs -->
      <span class="d-block text-coral fw-bold extra-small letter-spacing-1 mb-2">FULFILLMENT / SHIPPING</span>
      <div class="seller-page-title-row mb-4">
        <div>
          <h1 class="seller-page-title">Shipping</h1>
          <p class="text-secondary small mb-0">Track dispatches, print carrier airway bills, and coordinate logistics handoffs.</p>
        </div>
        <div class="d-flex align-items-center gap-2">
          <button type="button" class="btn btn-outline-seller" id="btnDownloadLabels">
            <i class="bi bi-download"></i> Download shipping labels
          </button>
          <button type="button" class="btn btn-coral-seller" id="btnMarkSelectedPacked">
            <i class="bi bi-box-seam"></i> Mark selected as packed
          </button>
        </div>
      </div>

      <!-- Shipping Filter Tabs -->
      <div class="d-flex align-items-center justify-content-between mb-3 border-bottom pb-2">
        <ul class="nav nav-pills gap-2" id="shippingFilterTabs">
          <li class="nav-item">
            <button class="nav-link active rounded-pill px-3 py-1 extra-small fw-bold text-dark bg-secondary-subtle" data-filter="all">All Shipments (<span id="shippingCountAll">0</span>)</button>
          </li>
          <li class="nav-item">
            <button class="nav-link rounded-pill px-3 py-1 extra-small fw-bold text-secondary" data-filter="ready">Ready to ship (<span id="shippingCountReady">0</span>)</button>
          </li>
          <li class="nav-item">
            <button class="nav-link rounded-pill px-3 py-1 extra-small fw-bold text-secondary" data-filter="transit">In transit (<span id="shippingCountTransit">0</span>)</button>
          </li>
          <li class="nav-item">
            <button class="nav-link rounded-pill px-3 py-1 extra-small fw-bold text-secondary" data-filter="delivered">Delivered (<span id="shippingCountDelivered">0</span>)</button>
          </li>
        </ul>
        <span class="text-muted extra-small">Auto-synced with 3 Logistics Partners</span>
      </div>

      <!-- Search & Filters Toolbar -->
      <div class="seller-filter-toolbar">
        <div class="flex-grow-1 position-relative" style="min-width: 240px;">
          <i class="bi bi-search position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"></i>
          <input type="text" id="shippingSearchInput" class="form-control form-control-sm ps-5 rounded-pill" placeholder="Search by order ID, customer, tracking number..." />
        </div>

        <select class="form-select form-select-sm w-auto rounded-pill" id="shippingCourierFilter">
          <option value="all">All Couriers</option>
          <option value="Blue Dart">Blue Dart</option>
          <option value="Delhivery">Delhivery</option>
          <option value="Ecom Express">Ecom Express</option>
        </select>

        <select class="form-select form-select-sm w-auto rounded-pill">
          <option>Date: Today</option>
          <option>Date: Last 7 days</option>
          <option>Date: This month</option>
        </select>
      </div>

      <!-- Shipping Table (Matching Figma Image 3 Screen 4) -->
      <div class="seller-card-table">
        <div class="table-responsive">
          <table class="table table-seller align-middle">
            <thead>
              <tr>
                <th width="40"><input type="checkbox" id="selectAllShipping" class="form-check-input" /></th>
                <th>Order ID</th>
                <th>Customer</th>
                <th>Delivery Address</th>
                <th>Courier Partner</th>
                <th>Tracking ID</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="shippingTableBody">
              <!-- Hydrated dynamically from seller.js -->
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>

  <!-- Reusable Seller Navy Footer -->
  <div id="sellerFooter"></div>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../common/js/global.js"></script>
  <script src="../js/seller-nav.js"></script>
  <script src="../js/seller.js"></script>
</body>
</html>
